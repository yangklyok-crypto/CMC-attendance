<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Check-in</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#9966cc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Check-in">
    <meta name="msapplication-TileColor" content="#9966cc">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
            border-radius: 15px;
        }
        
        .header h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .header p {
            color: #cccccc;
            font-size: 16px;
        }
        
        .install-prompt {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .install-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #444444;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #2a2a2a;
            color: #ffffff;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #9966cc;
            box-shadow: 0 0 0 3px rgba(153, 102, 204, 0.3);
        }
        
        .location-status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .location-pending {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        
        .location-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .location-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #9966cc 0%, #cc6699 100%);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(153, 102, 204, 0.4);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }
        
        .result-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .result-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .offline-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff5722;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
        
        .online-indicator {
            background: #4caf50;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="networkStatus" class="offline-indicator">
        📶 You're offline - attendance cannot be recorded
    </div>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Dead Simple Productivity Logo" class="logo">
            <h1>📍 Employee Check-in</h1>
            <p>Please allow location access to check in/out</p>
        </div>
        
        <div id="installPrompt" class="install-prompt">
            <p>📱 Install this app on your device for quick access!</p>
            <button id="installBtn" class="install-btn">Install App</button>
        </div>
        
        <form id="checkinForm">
            <div class="form-group">
                <label for="employeeId">Employee ID</label>
              <select id="employeeId" name="employee_id" required>
    <option value="">请选择员工</option>
</select>
</div>

<div class="form-group">
                <label for="action">Action</label>
                <select id="action" name="action" required>
                    <option value="">Select action</option>
                    <option value="in">🟢 Check In</option>
                    <option value="out">🔴 Check Out</option>
                </select>
            </div>
            <div class="form-group">
    <label>Selfie Photo</label>

    <div id="cameraBox" style="text-align:center;">
        <video
            id="camera"
            autoplay
            playsinline
            muted
            style="
                width:100%;
                max-width:350px;
                border-radius:12px;
                background:#000;
                transform:scaleX(-1);
            ">
        </video>

        <canvas id="photoCanvas" style="display:none;"></canvas>

        <img
            id="photoPreview"
            style="
                display:none;
                width:100%;
                max-width:350px;
                border-radius:12px;
                margin-top:10px;
            "
        >

        <button
            type="button"
            id="takePhotoBtn"
            class="submit-btn"
            style="margin-top:12px;">
            📷 Take Selfie
        </button>

        <button
            type="button"
            id="retakePhotoBtn"
            class="submit-btn"
            style="display:none;margin-top:10px;">
            🔄 Retake Photo
        </button>

        <p id="photoStatus" style="margin-top:10px;">
            ❌ Selfie required before attendance
        </p>
    </div>
</div>
            <div id="locationStatus" class="location-status location-pending">
                <span class="loading"></span>Getting your location...
            </div>
            
            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">
            
            <button type="submit" id="submitBtn" class="submit-btn" disabled>
                Submit Check-in/out
            </button>
        </form>
        
        <div id="resultMessage"></div>
    </div>

    <script>
       
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installPrompt.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installPrompt.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Network Status
        const networkStatus = document.getElementById('networkStatus');
        
        function updateNetworkStatus() {
            if (navigator.onLine) {
                networkStatus.textContent = '📶 You\'re back online!';
                networkStatus.className = 'offline-indicator online-indicator';
                setTimeout(() => {
                    networkStatus.style.display = 'none';
                }, 3000);
            } else {
                networkStatus.textContent = '📶 You\'re offline - changes will sync when online';
                networkStatus.className = 'offline-indicator';
                networkStatus.style.display = 'block';
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // Main App Logic
        const form = document.getElementById('checkinForm');
        const locationStatus = document.getElementById('locationStatus');
        const submitBtn = document.getElementById('submitBtn');
        const resultMessage = document.getElementById('resultMessage');
        const latInput = document.getElementById('latitude');
        const lngInput = document.getElementById('longitude');
        
        let locationObtained = false;
        let locationAccuracy = 0;
        let selfieTaken = false;
let selfieBlob = null;
let cameraStream = null;

const camera = document.getElementById('camera');
const photoCanvas = document.getElementById('photoCanvas');
const photoPreview = document.getElementById('photoPreview');
const takePhotoBtn = document.getElementById('takePhotoBtn');
const retakePhotoBtn = document.getElementById('retakePhotoBtn');
const photoStatus = document.getElementById('photoStatus');

async function startCamera() {
    try {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'user'
            },
            audio: false
        });

        camera.srcObject = cameraStream;
        photoStatus.innerHTML = '📷 Take a selfie to continue';

    } catch (error) {
        console.error('Camera error:', error);
        photoStatus.innerHTML =
            '❌ Camera permission required. Please allow camera access.';
    }
}

takePhotoBtn.addEventListener('click', function () {

    if (!camera.videoWidth || !camera.videoHeight) {
        alert('Camera is not ready yet.');
        return;
    }

    photoCanvas.width = camera.videoWidth;
    photoCanvas.height = camera.videoHeight;

    const ctx = photoCanvas.getContext('2d');

    ctx.translate(photoCanvas.width, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(
        camera,
        0,
        0,
        photoCanvas.width,
        photoCanvas.height
    );

    photoCanvas.toBlob(function(blob) {

        selfieBlob = blob;
        selfieTaken = true;

        const photoURL = URL.createObjectURL(blob);

        photoPreview.src = photoURL;
        photoPreview.style.display = 'block';

        camera.style.display = 'none';
        takePhotoBtn.style.display = 'none';
        retakePhotoBtn.style.display = 'block';

        photoStatus.innerHTML = '✅ Selfie captured';

        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

    }, 'image/jpeg', 0.75);
});

retakePhotoBtn.addEventListener('click', async function () {

    selfieTaken = false;
    selfieBlob = null;

    photoPreview.style.display = 'none';
    camera.style.display = 'block';

    takePhotoBtn.style.display = 'block';
    retakePhotoBtn.style.display = 'none';

    photoStatus.innerHTML = '📷 Take a new selfie';

    await startCamera();
});

startCamera();
        
        // ⚠️ IMPORTANT: Replace with your actual n8n webhook URL
        const WEBHOOK_URL = 'https://yangklyok.app.n8n.cloud/webhook/cmc-attendance';
        const EMPLOYEE_LIST_URL = 'https://yangklyok.app.n8n.cloud/webhook/cmc-employees';

async function loadEmployees() {
    try {
        const response = await fetch(EMPLOYEE_LIST_URL);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const employees = await response.json();

        const select = document.getElementById('employeeId');
        select.innerHTML = '<option value="">请选择员工</option>';

        employees.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.employeeId;
            option.textContent = `${emp.employeeName} (${emp.employeeId})`;
            select.appendChild(option);
        });

    } catch (error) {
        console.error('Failed to load employees:', error);

        const select = document.getElementById('employeeId');
        select.innerHTML = '<option value="">员工名单加载失败</option>';
    }
}

loadEmployees();
        
        function getCurrentLocation() {
            console.log('Requesting location...');
            if (navigator.geolocation) {
                locationStatus.className = 'location-status location-pending';
                locationStatus.innerHTML = '<span class="loading"></span>Getting your location...';
                
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        console.log('Location success:', position.coords);
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        locationAccuracy = accuracy;
                        
                        latInput.value = lat;
                        lngInput.value = lng;
                        locationObtained = true;
                        
                        locationStatus.className = 'location-status location-success';
                        locationStatus.innerHTML = `✅ Location obtained (±${Math.round(accuracy)}m accuracy)`;
                        submitBtn.disabled = false;
                    },
                    function(error) {
                        console.log('Location error:', error.code, error.message);
                        let errorMessage = '';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = "❌ Location access denied. Please enable location permissions.";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = "❌ Location information unavailable. Try moving closer to a window.";
                                break;
                            case error.TIMEOUT:
                                errorMessage = "❌ Location request timed out. Trying with less accuracy...";
                                break;
                            default:
                                errorMessage = "❌ An error occurred while retrieving location.";
                                break;
                        }
                        
                        locationStatus.className = 'location-status location-error';
                        locationStatus.innerHTML = errorMessage;
                        submitBtn.disabled = true;
                        
                        // If high accuracy failed, try with lower accuracy
                        if (error.code === error.TIMEOUT || error.code === error.POSITION_UNAVAILABLE) {
                            setTimeout(() => {
                                tryLowAccuracyLocation();
                            }, 2000);
                        }
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 60000
                    }
                );
            } else {
                locationStatus.className = 'location-status location-error';
                locationStatus.innerHTML = "❌ Geolocation is not supported by this browser.";
                submitBtn.disabled = true;
            }
        }
        
        function tryLowAccuracyLocation() {
            console.log('Trying low accuracy location...');
            locationStatus.className = 'location-status location-pending';
            locationStatus.innerHTML = '<span class="loading"></span>Trying low accuracy location...';
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    console.log('Low accuracy location success:', position.coords);
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    locationAccuracy = accuracy;
                    
                    latInput.value = lat;
                    lngInput.value = lng;
                    locationObtained = true;
                    
                    locationStatus.className = 'location-status location-success';
                    locationStatus.innerHTML = `✅ Location obtained (±${Math.round(accuracy)}m accuracy - low precision)`;
                    submitBtn.disabled = false;
                },
                function(error) {
                    console.log('Low accuracy location also failed:', error);
                    locationStatus.className = 'location-status location-error';
                    locationStatus.innerHTML = "❌ Unable to get location. Please check device settings.";
                    submitBtn.disabled = true;
                },
                {
                    enableHighAccuracy: false,
                    timeout: 30000,
                    maximumAge: 300000
                }
            );
        }
        
       form.addEventListener('submit', async function(e) {
    e.preventDefault();

  if (!selfieTaken || !selfieBlob) {
    alert('You must take a selfie before check-in/out.');
    return;
}

if (!locationObtained) {
    alert('Location is required before check-in/out.');
    return;
}

const formData = new FormData(form);
const rawData = Object.fromEntries(formData);
            
            // Create clean data object with Thailand time
            const now = new Date();
            const thailandTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Bangkok"}));
            
            // Convert the selfie taken by the camera into Base64
const selfieBase64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = function () {
        // Remove "data:image/jpeg;base64," and keep only Base64
        const base64 = String(reader.result).split(',')[1];
        resolve(base64);
    };

    reader.onerror = reject;
    reader.readAsDataURL(selfieBlob);
});

const data = {
    employeeId: rawData.employee_id || '',
    action: rawData.action || '',
    latitude: parseFloat(rawData.latitude) || 0,
    longitude: parseFloat(rawData.longitude) || 0,
    accuracy: locationAccuracy || 0,
    submissionId: crypto.randomUUID(),
    timestamp: new Date().toISOString(),

    // Selfie
    selfieBase64: selfieBase64,
    selfieMimeType: 'image/jpeg'
};
            
            console.log('Sending data:', data);
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Processing...';
            
            try {
                if (!navigator.onLine) {
    resultMessage.className = 'result-message result-error';
    resultMessage.innerHTML = '❌ No network. Attendance was NOT recorded.';
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Submit Check-in/out';
    return;
}
                
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                console.log('Response status:', response.status);
                const result = await response.json();
                if (response.ok && result.success) {
                    // Success - assume it worked if we got a 200 response
                   resultMessage.className = 'result-message result-success';

const lagosTime = new Date().toLocaleString('en-GB', {
    timeZone: 'Africa/Lagos',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
});

resultMessage.innerHTML = `
    ✅ ${data.action === 'in' ? 'Check-in' : 'Check-out'} successful!<br>
    <small>
    Employee ID: ${data.employeeId}<br>
    Time: ${lagosTime}<br>
    GPS: ${data.latitude}, ${data.longitude}<br>
    Accuracy: ±${Math.round(data.accuracy)}m
    </small>
`;
                    form.reset();
                    locationObtained = false;
                    setTimeout(() => {
                        getCurrentLocation();
                    }, 2000);
                } else {
                    // Try to get error message from response
                    let errorText = 'Unknown error occurred';
                    try {
                        const result = await response.text();
                        errorText = result || `HTTP ${response.status}`;
                    } catch (e) {
                        errorText = `HTTP ${response.status}`;
                    }
                    
                    resultMessage.className = 'result-message result-error';
resultMessage.innerHTML = `
    ❌ ${result.message || 'Attendance failed'}
`;
                }
          } catch (error) {
    console.error('Attendance submission failed:', error);

    resultMessage.className = 'result-message result-error';
    resultMessage.innerHTML =
        '❌ Network error. Attendance was NOT recorded. Please reconnect and try again.';
}finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Check-in/out';
            }
        });
        
        getCurrentLocation();
        setInterval(() => {
            if (document.visibilityState === 'visible') {
                getCurrentLocation();
            }
        }, 300000);
        

    </script>
