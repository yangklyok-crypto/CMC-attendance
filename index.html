/* ---------- COMPANY LOGO ---------- */

.logo {
    display: block;

    width: 100%;
    max-width: 330px;
    height: auto;

    margin: 0 auto 22px;

    object-fit: contain;

    border-radius: 0;
}


/* ---------- TITLE ---------- */

.header h1 {
    margin: 0 0 8px;

    color: #101828;

    font-size: 31px;
    font-weight: 800;
    line-height: 1.15;

    letter-spacing: -0.8px;
}


/* Subtitle */

.header p {
    margin: 0 auto;

    max-width: 390px;

    color: #667085;

    font-size: 15px;
    line-height: 1.55;
}


/* ---------- FORM ---------- */

.form-group {
    margin-bottom: 24px;
}


/* Labels */

.form-group label {
    display: block;

    margin-bottom: 10px;

    color: #101828;

    font-size: 16px;
    font-weight: 700;
}


/* ---------- INPUTS / SELECT ---------- */

.form-group input,
.form-group select {
    width: 100%;

    padding: 16px 17px;

    box-sizing: border-box;

    border: 1px solid #d0d5dd;
    border-radius: 14px;

    background: #ffffff;

    color: #101828;

    font-size: 16px;
    font-weight: 500;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}


.form-group input:hover,
.form-group select:hover {
    border-color: #98a2b3;
}


.form-group input:focus,
.form-group select:focus {
    border-color: #f15a29;

    box-shadow:
        0 0 0 4px rgba(241,90,41,0.11);
}

#cameraBox {
    position: relative;

    padding: 14px;

    background:
        linear-gradient(
            145deg,
            #fafafa,
            #f3f5f7
        );

    border: 1.5px dashed #c9ced6;

    border-radius: 18px;

    overflow: hidden;
}


#camera {
    display: block;

    width: 100% !important;
    max-width: 100% !important;

    border-radius: 14px !important;

    background: #e9edf2 !important;

    box-shadow:

#photoPreview {

    box-shadow:

}

    font-size: 14px;

}

#retakePhotoBtn {

    box-shadow:

}


#takePhotoBtn:hover,
#retakePhotoBtn:hover {
    transform: translateY(-1px);

    background: #101828;
}

.location-status {
    margin: 20px 0 24px;

    padding: 15px 16px;

    border-radius: 14px;

    text-align: left;

    font-size: 14px;
    font-weight: 600;

    line-height: 1.5;
}


.location-pending {

    border: 1px solid #e4e7ec;
}


.location-success {
    color: #067647;

    background: #ecfdf3;

    border: 1px solid #abefc6;
}


.location-error {
    color: #b42318;

    background: #fef3f2;

    border: 1px solid #fecdca;
}

.submit-btn,
#submitBtn {
    width: 100%;

    padding: 17px 18px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            100deg,
            #ef5424 0%,
            #ff6b2c 55%,
            #ff7c34 100%

    color: #ffffff;

    font-size: 18px;
    font-weight: 800;

    letter-spacing: 0;

    text-transform: none;

    cursor: pointer;

    box-shadow:

    transition:

        box-shadow 0.2s ease;
}


.submit-btn:hover,
#submitBtn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 14px 30px rgba(241,90,41,0.30);
}


.submit-btn:disabled,
#submitBtn:disabled {
    background: #d0d5dd;

    color: #ffffff;

    box-shadow: none;

    transform: none;

    cursor: not-allowed;
}

    font-size: 14px;
    font-weight: 600;

    line-height: 1.5;
}


.result-success {
    background: #ecfdf3;

    color: #067647;

    border: 1px solid #abefc6;
}


.result-error {
    background: #fef3f2;

    color: #b42318;

    border: 1px solid #fecdca;
}

.install-btn {

    color: #b42318 !important;

    border: 1px solid #fecdca;
}

            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {

                }

            if (navigator.onLine) {

                networkStatus.className = 'offline-indicator online-indicator';
                setTimeout(() => {
                    networkStatus.style.display = 'none';

            } else {
                networkStatus.textContent = '📶 You\'re offline - changes will sync when online';
                networkStatus.className = 'offline-indicator';
                networkStatus.style.display = 'block';
            }
        }

async function startCamera() {
    try {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'user'
            },
            audio: false
        });

        camera.srcObject = cameraStream;
        photoStatus.innerHTML = '📷 Take a selfie to continue';

    } catch (error) {
        console.error('Camera error:', error);
        photoStatus.innerHTML =
            '❌ Camera permission required. Please allow camera access.';
    }
}

takePhotoBtn.addEventListener('click', function () {

    if (!camera.videoWidth || !camera.videoHeight) {
        alert('Camera is not ready yet.');
        return;
    }

    photoCanvas.width = camera.videoWidth;
    photoCanvas.height = camera.videoHeight;

    const ctx = photoCanvas.getContext('2d');

    ctx.translate(photoCanvas.width, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(
        camera,
        0,
        0,
        photoCanvas.width,
        photoCanvas.height
    );

    photoCanvas.toBlob(function(blob) {

        selfieBlob = blob;
        selfieTaken = true;

        const photoURL = URL.createObjectURL(blob);

        photoPreview.src = photoURL;
        photoPreview.style.display = 'block';

        camera.style.display = 'none';
        takePhotoBtn.style.display = 'none';
        retakePhotoBtn.style.display = 'block';

        photoStatus.innerHTML = '✅ Selfie captured';

        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

    }, 'image/jpeg', 0.75);
});

    takePhotoBtn.style.display = 'block';
    retakePhotoBtn.style.display = 'none';

    photoStatus.innerHTML = '📷 Take a new selfie';

    await startCamera();
});

        function getCurrentLocation() {
            console.log('Requesting location...');
            if (navigator.geolocation) {
                locationStatus.className = 'location-status location-pending';
                locationStatus.innerHTML = '<span class="loading"></span>Getting your location...';
                
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        console.log('Location success:', position.coords);
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        locationAccuracy = accuracy;
                        
                        latInput.value = lat;
                        lngInput.value = lng;
                        locationObtained = true;
                        
                        locationStatus.className = 'location-status location-success';
                        locationStatus.innerHTML = `✅ Location obtained (±${Math.round(accuracy)}m accuracy)`;
                        submitBtn.disabled = false;
                    },
                    function(error) {
                        console.log('Location error:', error.code, error.message);
                        let errorMessage = '';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = "❌ Location access denied. Please enable location permissions.";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = "❌ Location information unavailable. Try moving closer to a window.";
                                break;
                            case error.TIMEOUT:
                                errorMessage = "❌ Location request timed out. Trying with less accuracy...";
                                break;
                            default:
                                errorMessage = "❌ An error occurred while retrieving location.";
                                break;
                        }
                        
                        locationStatus.className = 'location-status location-error';
                        locationStatus.innerHTML = errorMessage;
                        submitBtn.disabled = true;
                        
                        // If high accuracy failed, try with lower accuracy
                        if (error.code === error.TIMEOUT || error.code === error.POSITION_UNAVAILABLE) {
                            setTimeout(() => {
                                tryLowAccuracyLocation();
                            }, 2000);
                        }
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 60000
                    }
                );
            } else {
                locationStatus.className = 'location-status location-error';
                locationStatus.innerHTML = "❌ Geolocation is not supported by this browser.";
                submitBtn.disabled = true;
            }
        }
        
        function tryLowAccuracyLocation() {

                    submitBtn.disabled = true;
                },

                    maximumAge: 300000
                }
            );
